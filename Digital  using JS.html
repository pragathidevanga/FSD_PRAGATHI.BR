<html>
    <head>
        <title>
            Digital Clock
        </title>
        <style>
            h1{
                color: white;
            }
            h2{
                color: palevioletred;
                font-family: monospace;
                font-size: 4em;
                background-color: black;
                width: 400px;
                box-shadow: 0px 0px 8px 10px palevioletred;
                border-radius: 5px;
                margin-left: 550px;
                margin-top: 250px;
                padding: 10px;
                
            }
            body{
                text-align: center;
                background-color: black;
            }
        </style>
    </head>
    <body>
        <h1>Digital Clock</h1>
        <h2 id="clock"></h2>
        <script>
            function Time()
            {
                let now = new Date();
                let hours = now.getHours();
                let minutes = now.getMinutes();
                let seconds = now.getSeconds();

                if(hours < 10)
                {
                    hours = "0" + hours;
                }

                 if(minutes < 10)
                {
                    minutes = "0" + minutes;
                }

                 if(seconds < 10)
                {
                    seconds = "0" + seconds;
                }

                let digital = hours+":"+minutes+":"+seconds;
                document.getElementById('clock').textContent = digital;
            }
            Time();
            setInterval(Time,1000);
        </script>
    </body>
</html>
