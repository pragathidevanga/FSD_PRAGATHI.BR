<html>
    <head>
        <title>Valentine's Week Finder</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: url(./8382919.jpg);
            background-size: cover;
            background-position: 110%;
        }

        div{
            text-align: center;
            width: 360px;
            margin: 100px auto;
            background-color: #fff;
            padding: 15px;
            box-shadow: 0px 0px 10px gray;
            border-radius: 10px;
        }

        h1{
            color:#c2185b;
        }

        input{
            width: 95%;
            padding: 8px;
            margin: 8px;
            border-radius: 5px;
        }

        button{
            padding: 10px;
            margin: 6px;
            border: none;
            background: linear-gradient(#ff416c,#ff7eb3);
            border-radius: 5px;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        fieldset{
            background-color: #fff0f5;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #f48fb1;
        }

        legend{
            font-size: 18px;
            font-weight: bold;
            color:#ad1457;
        }

        p{
            font-size: 18px;
            font-weight: bold;
        }
        marquee {
            font-size: 22px;
            color: white;
            font-weight: bold;
            background: #e91e63;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
    </head>
    <body>
        <marquee>💕Welcome to  Valentine's Week 💕 🥰 Check Your Unique Day 🥰</marquee>
        <div>
            <h1>💞 Valentine’s Week Finder 💞</h1>

        <label><b>Enter Date (7–14):</b></label>
        <input type="number" placeholder="Enter date" id="day">

        <button onclick="Show_Day()">Submit</button>
        <button onclick="restart()">Refresh</button>

        <fieldset>
        <legend>Valentine Details</legend>
        <p id="pdate"></p>
        <p id="pday"></p>
        <p id="pmessage"></p>
        </fieldset>
        </div>
    
       <script>
            function Show_Day(){
                let d = document.getElementById("day").value;
                let dayName = "";
                let message = "";

                switch(d)
                {
                    case "7":
                        dayName = "Rose Day 🌹";
                        message = "🌹 A rose for love, a smile for you❤️";
                        break;

                    case "8":
                        dayName = "Propose Day 💍";
                        message = "Confess your love Today is the day to speak your heart 💖";
                        break;

                    case "9":
                        dayName = "Chocolate Day 🍫";
                        message = "🍫 Sweet chocolates, sweeter memories 😍";
                        break;

                    case "10":
                        dayName = "Teddy Day 🧸";
                        message = "Gift a cute teddy 🧸Soft, warm, and full of love 🤗";
                        break;

                    case "11":
                        dayName = "Promise Day 🤝";
                        message = "💞 Trust is the strongest bond";
                        break;

                    case "12":
                        dayName = "Hug Day 🤗";
                        message = "🤗 One hug can say a thousand words💓";
                        break;

                    case "13":
                        dayName = "Kiss Day 😘";
                        message = "😘 A kiss to seal our love Let hearts meet gently";
                        break;

                    case "14":
                        dayName = "Valentine’s Day ❤️";
                        message = "❤️ Two hearts, one beautiful journey 🌸 Happy Valentine’s Day";
                        break;

                    default:
                        dayName = "Invalid Date ❌";
                        message = "Enter date between 7 and 14";
                }
            
                document.getElementById("pdate").textContent = "Date : February " + d;
                document.getElementById("pday").textContent = "Day : " + dayName;
                document.getElementById("pmessage").textContent = "Message : " + message;
            }

            function restart(){
                document.getElementById("day").value = "";
                document.getElementById("pdate").textContent = "";
                document.getElementById("pday").textContent = "";
                document.getElementById("pmessage").textContent = "";
            }
        </script>
    </body>
</html>
