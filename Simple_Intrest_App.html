<html>
    <head>
        <title>
            Simple Intrest App
        </title>
        <style>
            body{
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>Simple Intrest App</h1>
        <script>
            let p_amt = Number(prompt("Enter Pricipal Amount:"));
            let Time  = Number(prompt("Enter time in months:"));
            let Rate  = Number(prompt("Enter rate of intrest"));
            let S_intrest = p_amt * Time * Rate / 100;
            document.write("Pricipal Amount is:"+ p_amt+"<br>");
            document.write("Time is:" + Time + "<br>");
            document.write("Rate is:"+ Rate + "<br>");
            document.write("Simple intrest is:" + S_intrest + "<br>");

        </script>
    </body>
</html>
