<html>
    <head>
        <title>
            Instagram_Login_Page
        </title>
        <style>
            body{
                height: 100vh;
                text-align: center;
                background: #fafafa;
                margin-left: 750px;
                margin-right: 750px;
                padding-top: 100px;
            }
            form{
                width: 350px;
                text-align: center;
            }
            fieldset{
                border: 1px solid #dbdbdb;
                background: white;
                padding: 10px;
                margin-bottom: 10px;
            }
            h1{
                font-family: 'Brush Script MT',cursive;
                font-size: 42px;
                margin-bottom: 30px;
                font-weight: normal 'cursive';
            }
            input{
                width: 288px;
                padding: 10px;
                margin-bottom: 8px;
                border: 1px solid #dbdbdb;
                background: #fafafa;
                border-radius: 5px;
            }
            button{
                width: 288px;
                padding: 10px;
                background: #4cb5f9;
                border: none;
                color: white;
                border-radius: 5px;
                font-size: 15px;
            }
            .r1{
                margin: 20px; 
                color: #8e8e8e;
                font-size: 13px;
            }
            .r2{
                color: #1877f2;
                font-size: 19px;
            }
            .r3{
                font-size: 16px; 
                color: black;
            }
            .r4{
                margin-top: 20px; 
                font-size: 14px;
            }
            img{
                width: 130px;
                margin: 10px;
            }
            .i1{
                width: 20px;
                height: 20px;
            }
        </style>
    </head>
    <body>
        <form>
            <fieldset>
                <h1>Instagram</h1>
                <input type="text" placeholder="Phone number, username, or email" required><br>
                <input type="password" placeholder="Password" required><br>
                <button><b>Log in</b></button><br>
                <p class="r1"><span>───────────── OR ──────────────</span></p>
                <img class="i1" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSdB1EDkgELKWLkyEUW9LPJQ4P3Vzre6fwjTw&s%22%3E" alt="">
                <p class="r2"><b>Log in with Facebook</b></p>
                <p class="r3"><b>Forgot password?</b></p>
            </fieldset>
            <fieldset>
                <p> Don't have an account?
                <span style="color: #0095f6;"><b>Sign up</b></span></p>
            </fieldset>
            <p class="r4"><B>Get the app</B></p>
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg">
            <img src="https://developer.microsoft.com/store/badges/images/English_get-it-from-MS.png">
        </form>
    </body>
</html>
