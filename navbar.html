<html>
    <head>
        <title>
            Navbar
        </title>
        <style>
            .nav{
                background-color: brown;
                color: white;
                padding: 10px;
                display: flex;
                list-style: none;
                gap: 20px;
                justify-content: end;
            }
            button{
                margin-top: 10px;
                padding: 10px;
                background-color: yellow;
                width: 200px;
                border: none;
                color: rgb(1 , 62 , 175);
                border-radius: 5px;
                text-decoration: none;
            }
            button:hover{
                background-color: rgb(203, 25, 203);
            }
        </style>
    </head>
    <body>
        <div class="nav">
            <li><a href="https://www.alliance.edu.in/">Home</a></li>
            <li>Menu</li>
            <li>Services</li>
            <li>About</li>
        </div>
        <button><a href="https://www.flipkart.com/">Filpkart</a></button>
    </body>
</html>
