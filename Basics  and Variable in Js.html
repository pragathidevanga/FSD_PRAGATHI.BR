<html>
    <head>
        <title>Intro of Java Script</title>
    </head>
    <style>
        h1{
            text-align: center;
        }
    </style>
    <body>
        <h1>Intro of Java Script</h1>
        <script>
            var  a = 10; // variable
            a = "Pragathi"; // updating
            var a = 15.01; // re declaration
            console.log(a);

            let b = 50; // let variable
            b = "Pragathi"; // updating
            console.log(b); // printing statement

            const c = 30; // constant variable
            console.log(c); // printing statement

            document.write(a);
        </script>
    </body>
</html>
