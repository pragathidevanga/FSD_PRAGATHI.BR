<html>
    <head>
        <title>
            Calculator
        </title>
        <style>
            body{
                background: skyblue;    
                
            }
            fieldset{
                margin-left: 500px;
                margin-right: 640px;
                background-color: black;
                margin-top: 100px;
            }
            .display{
                display: grid;
                grid-template-columns: 25% 25% 25% 25%;
                padding: 10px;
            }
            .display div{
                border: 1px solid black;
                font-size: 30px;
                padding: 10px;
                text-align: center;
                border-radius: 10px;
            }
            input{
                width: 400px;
                margin-left: 7px;
                height: 50px;
                border-radius: 6px;
                background-color: #42b72a;
            }
            .b1{
                background-color: white;
            }
            .arithmetic{
                background-color: #1877f2;
                color: black;
            }
            .cancel{
                background-color: red;
                border: none;
            }
            .equal{
                background-color: lawngreen;
                border: none;
            }
        </style>
    </head>
    <body>
        <fieldset>
            <div class="calcu">
                <input type="text"placeholder="0">
            </div>
            <div class="display">
                <div class="b1">7</div>
                <div class="b1">8</div>
                <div class="b1">9</div>
                <div class="arithmetic">+</div>
                <div class="b1">4</div>
                <div class="b1">5</div>
                <div class="b1">6</div>
                <div class="arithmetic">-</div>
                <div class="b1">1</div>
                <div class="b1">2</div>
                <div class="b1">3</div>
                <div class="arithmetic">x</div>
                <div class="cancel">C</div>
                <div class="b1">0</div>
                <div class="equal">=</div>
                <div class="arithmetic">/</div>
            </div>
        </fieldset>
    </body>
</html>
